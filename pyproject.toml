[project]
name = "vendormatch"
version = "0.1.0"
description = "Entity resolution for messy vendor and company records, with a benchmark that measures every stage."
readme = "README.md"
license = "MIT"
authors = [{ name = "Amadeus Colenbrander" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
llm = ["mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
vendormatch = "vendormatch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendormatch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: needs a local MLX model and Apple Silicon GPU (skipped in CI)"]
